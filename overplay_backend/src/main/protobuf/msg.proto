syntax = "proto2";
package dev.anygeneric.overplay_backend.proto;
message StartupMessage {
  required string name = 1;
}
message NewTelemetry {
  required int32 id = 1;
  required string value = 2;
}
message TelemetryValue {
  required int32 for_id = 1;
  optional int32 value_int = 2;
  optional string value_str = 3;
  optional double value_double = 4;
  optional int64 time = 5;
}